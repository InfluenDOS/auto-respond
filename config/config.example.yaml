# auto-respond 主配置

# 你在聊天记录中的名字（用于识别哪些消息是你发的）
user_name: 我

llm:
  provider: openai_compatible  # mock | openai_compatible
  api_key: ${OPENAI_API_KEY}   # 也可直接写 key，建议用环境变量
  base_url: https://api.openai.com/v1
  # DeepSeek 示例:
  # base_url: https://api.deepseek.com/v1
  # model: deepseek-chat
  model: gpt-4o-mini
  temperature: 0.7

generation:
  num_suggestions: 3           # 生成几条回复建议
  max_context_messages: 30     # 最多参考多少条历史消息
  style: 自然、口语化，像真实微信聊天
  language: zh

log_level: INFO
