[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-respond"
version = "0.2.0"
description = "根据微信聊天记录智能生成回复建议"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
auto-respond = "auto_respond.app:main"

[tool.setuptools.packages.find]
where = ["src"]
